services:
  postgres-test:
    image: postgres:18.4-alpine
    ports:
      - "15433:5432"
    environment:
      POSTGRES_USER: fairytale
      POSTGRES_PASSWORD: test
      POSTGRES_DB: fairytale_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairytale -d fairytale_test"]
      interval: 2s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql
